[project]
name = "escalation-ladder"
version = "0.1.0"
description = "Companion code for The 7 GenAI Architectures: one incident-triage implementation per rung."
requires-python = ">=3.12"
# Pinned in Chapter 3, which fixes the stack for the whole book. Chapter 3's own
# code imports none of it -- the Level 0 slice is standard library only, and
# these first matter in Chapter 4.
dependencies = [
    "anthropic>=0.120,<1.0",
    "pydantic>=2.13,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "matplotlib>=3.9"]
# Chapter 8's framework seam. An EXTRA rather than a dependency, and the chapter
# argues why: `orchestration.SequentialChain` is the shipped default and
# `LangGraphChain` is the measured comparison beside it. Installing this pulls in
# 22 further packages on top of the two above, which is the number the Level 5
# cost table reports. Nothing in the book requires it - the test suite skips its
# arm when absent, and `rungs.load_all` still registers Level 5, because
# `orchestration` imports langgraph inside the method rather than at module
# scope. Chapters 9 and 10 are where the extra starts paying for itself.
graph = ["langgraph>=1.2,<2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["escalation_ladder*"]

# The runbook corpus is data, not code, and `runbooks/` is not a package. Without this a
# non-editable install ships no .md files and runbook_paths() returns an empty list.
[tool.setuptools.package-data]
escalation_ladder = ["fixtures/runbooks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
