[project]
name = "escalation-ladder"
version = "0.1.0"
description = "Companion code for The 7 GenAI Architectures: one incident-triage implementation per rung."
requires-python = ">=3.12"
# Pinned in Chapter 3, which fixes the stack for the whole book. Chapter 3's own
# code imports none of it -- the Level 0 slice is standard library only, and
# these first matter in Chapter 4.
dependencies = [
    "anthropic>=0.120,<1.0",
    "pydantic>=2.13,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["escalation_ladder*"]

# The runbook corpus is data, not code, and `runbooks/` is not a package. Without this a
# non-editable install ships no .md files and runbook_paths() returns an empty list.
[tool.setuptools.package-data]
escalation_ladder = ["fixtures/runbooks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
